<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 612 360" fill="none">
  <defs>
    <clipPath id="bayclip"><rect x="269" y="225" width="116" height="95"/></clipPath>
    <filter id="hlblur" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4.5"/></filter>
    <filter id="neonblur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3.2"/></filter>
    <filter id="neonwide" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>
  <style>
    .gdoor{animation:gd 9s ease-in-out infinite}
    @keyframes gd{0%,10%{transform:translateY(0)}35%,70%{transform:translateY(-82px)}95%,100%{transform:translateY(0)}}
    .hglow{animation:hg 9s ease-in-out infinite}
    @keyframes hg{0%,14%{opacity:0}38%,66%{opacity:1}92%,100%{opacity:0}}
    .neon{animation:nf 6s linear infinite}
    @keyframes nf{0%,100%{opacity:1}46%{opacity:1}47%{opacity:.55}48%{opacity:1}50%{opacity:.7}51%{opacity:1}}
  </style>

  <!-- sky accents -->
  <circle cx="90" cy="120" r="3" fill="#FFFFFF" opacity=".4"/>
  <circle cx="455" cy="95" r="3" fill="#FFFFFF" opacity=".4"/>
  <circle cx="300" cy="70" r="2.5" fill="#3B8EE2" opacity=".6"/>

  <!-- ground -->
  <path d="M12 322 H600" stroke="#3B8EE2" stroke-width="3.5" stroke-linecap="round"/>

  <!-- skyline of condo buildings -->
  <path d="M30 322 V232 H130 V322" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round" opacity=".85"/>
  <path d="M130 322 V178 L252 158 V322" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round" opacity=".85"/>
  <path d="M252 322 V200 H402 V322" stroke="#FFFFFF" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M402 322 V162 H540 V322" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round" opacity=".85"/>

  <!-- small details on neighbor buildings -->
  <path d="M55 262 H105 M55 278 H105" stroke="#FFFFFF" stroke-width="2" opacity=".4"/>
  <path d="M152 200 V218 M178 196 V218 M204 192 V218 M230 188 V218" stroke="#FFFFFF" stroke-width="2" opacity=".4"/>
  <path d="M424 190 H518 M424 206 H518" stroke="#FFFFFF" stroke-width="2" opacity=".4"/>
  <path d="M446 184 V212 M472 184 V212 M498 184 V212" stroke="#FFFFFF" stroke-width="2" opacity=".4"/>

  <!-- shut door on the slanted building -->
  <rect x="156" y="236" width="74" height="86" fill="#1B1B1B"/>
  <path d="M156 322 V236 H230 V322" stroke="#FFFFFF" stroke-width="2.6" opacity=".8"/>
  <path d="M156 250 H230 M156 264 H230 M156 278 H230 M156 292 H230 M156 306 H230" stroke="#3B8EE2" stroke-width="2.4" opacity=".55"/>
  <rect x="184" y="314" width="18" height="3.5" rx="1.75" fill="#FFFFFF" opacity=".5"/>

  <!-- open door on the right building, car resting inside -->
  <path d="M428 322 V214 H514 V322" stroke="#FFFFFF" stroke-width="2.6" opacity=".8"/>
  <rect x="428" y="214" width="86" height="13" fill="#1B1B1B"/>
  <path d="M428 219 H514 M428 224 H514" stroke="#3B8EE2" stroke-width="2" opacity=".55"/>

  <!-- neon AC sign on the back wall of the open bay -->
  <g class="neon" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <ellipse cx="472" cy="256" rx="40" ry="22" fill="#4FB3FF" opacity=".16" filter="url(#neonwide)"/>
    <path d="M446 269 L455.5 243 L465 269 M449.6 260 H461.4 M498 248.5 C495.5 244.8 492 243 488.5 243 C482.5 243 478.5 248.5 478.5 256 C478.5 263.5 482.5 269 488.5 269 C492 269 495.5 267.2 498 263.5" stroke="#4FB3FF" stroke-width="7" opacity=".55" filter="url(#neonblur)"/>
    <path d="M446 269 L455.5 243 L465 269 M449.6 260 H461.4 M498 248.5 C495.5 244.8 492 243 488.5 243 C482.5 243 478.5 248.5 478.5 256 C478.5 263.5 482.5 269 488.5 269 C492 269 495.5 267.2 498 263.5" stroke="#4FB3FF" stroke-width="3.6"/>
    <path d="M446 269 L455.5 243 L465 269 M449.6 260 H461.4 M498 248.5 C495.5 244.8 492 243 488.5 243 C482.5 243 478.5 248.5 478.5 256 C478.5 263.5 482.5 269 488.5 269 C492 269 495.5 267.2 498 263.5" stroke="#EAF6FF" stroke-width="1.4"/>
    <path d="M455.5 236 V241 M488.5 236 V241" stroke="#FFFFFF" stroke-width="1.2" opacity=".35"/>
  </g>
  <g opacity=".85" transform="translate(235.6,95.4) scale(0.72)">
    <rect x="276" y="294" width="12" height="18" rx="4" fill="#0D1117" stroke="#FFFFFF" stroke-width="2.4"/>
    <rect x="366" y="294" width="12" height="18" rx="4" fill="#0D1117" stroke="#FFFFFF" stroke-width="2.4"/>
    <path d="M284 312 V293 C284 283 291 276 301 275 L353 275 C363 276 370 283 370 293 V312 Z"
          fill="#3B8EE2" fill-opacity=".28" stroke="#3B8EE2" stroke-width="2.8" stroke-linejoin="round"/>
    <path d="M297 275 C299 264 306 258 314 257 L340 257 C348 258 355 264 357 275"
          fill="none" stroke="#3B8EE2" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M303 273 C305 266 309 262 315 261 L339 261 C345 262 349 266 351 273 Z"
          fill="#0D1117" opacity=".55" stroke="#3B8EE2" stroke-width="1.6"/>
    <path d="M284 280 L276 276 M370 280 L378 276" stroke="#3B8EE2" stroke-width="2.4" stroke-linecap="round"/>
    <ellipse cx="298" cy="286" rx="10" ry="5.5" fill="#FFE14D" opacity=".4" filter="url(#hlblur)"/>
    <ellipse cx="356" cy="286" rx="10" ry="5.5" fill="#FFE14D" opacity=".4" filter="url(#hlblur)"/>
    <path d="M291 287 L306 284 M348 284 L363 287" stroke="#FFE14D" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M305 302 H349" stroke="#3B8EE2" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M296 307 H302 M352 307 H358" stroke="#3B8EE2" stroke-width="2.2" stroke-linecap="round" opacity=".7"/>
  </g>

  <!-- highlighted bay: glow + car behind the animated door -->
  <rect x="266" y="222" width="122" height="100" fill="#3B8EE2" opacity=".08"/>

  <!-- the car: head-on front view, revealed as the door rolls up -->
  <g>
    <rect x="276" y="294" width="12" height="18" rx="4" fill="#0D1117" stroke="#FFFFFF" stroke-width="2.4"/>
    <rect x="366" y="294" width="12" height="18" rx="4" fill="#0D1117" stroke="#FFFFFF" stroke-width="2.4"/>
    <path d="M284 312 V293 C284 283 291 276 301 275 L353 275 C363 276 370 283 370 293 V312 Z"
          fill="#3B8EE2" fill-opacity=".28" stroke="#3B8EE2" stroke-width="2.8" stroke-linejoin="round"/>
    <path d="M297 275 C299 264 306 258 314 257 L340 257 C348 258 355 264 357 275"
          fill="none" stroke="#3B8EE2" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M303 273 C305 266 309 262 315 261 L339 261 C345 262 349 266 351 273 Z"
          fill="#0D1117" opacity=".55" stroke="#3B8EE2" stroke-width="1.6"/>
    <path d="M284 280 L276 276 M370 280 L378 276" stroke="#3B8EE2" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M291 287 L306 284 M348 284 L363 287" stroke="#FFB020" stroke-width="3.2" stroke-linecap="round"/>
    <g class="hglow">
      <ellipse cx="298" cy="286" rx="11" ry="6" fill="#FFB020" opacity=".55" filter="url(#hlblur)"/>
      <ellipse cx="356" cy="286" rx="11" ry="6" fill="#FFB020" opacity=".55" filter="url(#hlblur)"/>
      <ellipse cx="298" cy="286" rx="5" ry="3" fill="#FFD57A" filter="url(#hlblur)"/>
      <ellipse cx="356" cy="286" rx="5" ry="3" fill="#FFD57A" filter="url(#hlblur)"/>
    </g>
    <path d="M305 302 H349" stroke="#3B8EE2" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M296 307 H302 M352 307 H358" stroke="#3B8EE2" stroke-width="2.2" stroke-linecap="round" opacity=".7"/>
  </g>

  <!-- animated roll-up door (clipped to the opening) -->
  <g clip-path="url(#bayclip)">
    <g class="gdoor">
      <rect x="269" y="225" width="116" height="95" fill="#1B1B1B"/>
      <path d="M269 239 H385 M269 253 H385 M269 267 H385 M269 281 H385 M269 295 H385 M269 309 H385" stroke="#3B8EE2" stroke-width="3"/>
      <path d="M269 232 H385" stroke="#FFFFFF" stroke-width="2" opacity=".5"/>
      <rect x="315" y="314" width="24" height="4" rx="2" fill="#FFFFFF" opacity=".8"/>
    </g>
  </g>

  <!-- bay frame on top -->
  <path d="M266 322 V222 H388 V322" stroke="#FFFFFF" stroke-width="3"/>

  <!-- palms along the right edge -->
  <g stroke-linecap="round" fill="none">
    <path d="M566 322 C564 300 568 278 574 260" stroke="#FFFFFF" stroke-width="3" opacity=".85"/>
    <path d="M574 260 C566 254 556 252 548 255 M574 260 C570 250 562 244 554 243 M574 260 C577 249 585 242 594 241 M574 260 C583 253 593 251 601 254 M574 260 C580 256 590 258 596 263" stroke="#3B8EE2" stroke-width="2.6" opacity=".9"/>
    <path d="M596 322 C595 308 597 296 601 286" stroke="#FFFFFF" stroke-width="2.6" opacity=".7"/>
    <path d="M601 286 C595 281 588 279 582 281 M601 286 C599 278 593 273 587 272 M601 286 C605 278 611 274 617 274 M601 286 C607 282 614 282 619 285" stroke="#3B8EE2" stroke-width="2.2" opacity=".75"/>
  </g>
</svg>

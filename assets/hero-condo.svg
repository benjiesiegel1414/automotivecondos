  <path d="M84 350 C84 340 91 334 98 334 H116 L130 320 H174 L190 334 H202 C210 334 214 340 214 350 Z" fill="#FFFFFF" fill-opacity=".10" stroke="#FFFFFF" stroke-width="2.6"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" fill="none">
  <!-- sky accents -->
  <circle cx="90" cy="120" r="3" fill="#FFFFFF" opacity=".4"/>
  <circle cx="455" cy="95" r="3" fill="#FFFFFF" opacity=".4"/>
  <circle cx="300" cy="70" r="2.5" fill="#3B8EE2" opacity=".6"/>

  <!-- ground -->
  <path d="M12 322 H548" stroke="#3B8EE2" stroke-width="3.5" stroke-linecap="round"/>

  <!-- skyline of condo buildings -->
  <path d="M30 322 V232 H130 V322" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round" opacity=".85"/>
  <path d="M130 322 V178 L252 158 V322" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round" opacity=".85"/>
  <path d="M252 322 V200 H402 V322" stroke="#FFFFFF" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M402 322 V162 H540 V322" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round" opacity=".85"/>

  <!-- small details on neighbor buildings -->
  <path d="M55 262 H105 M55 278 H105" stroke="#FFFFFF" stroke-width="2" opacity=".4"/>
  <path d="M152 200 V218 M178 196 V218 M204 192 V218 M230 188 V218" stroke="#FFFFFF" stroke-width="2" opacity=".4"/>
  <path d="M424 190 H518 M424 206 H518" stroke="#FFFFFF" stroke-width="2" opacity=".4"/>
  <path d="M446 184 V212 M472 184 V212 M498 184 V212" stroke="#FFFFFF" stroke-width="2" opacity=".4"/>

  <!-- highlighted bay: glow + open slatted door -->
  <rect x="266" y="222" width="122" height="100" fill="#3B8EE2" opacity=".08"/>
  <path d="M266 322 V222 H388 V322" stroke="#FFFFFF" stroke-width="3"/>
  <path d="M266 234 H388 M266 246 H388" stroke="#3B8EE2" stroke-width="3.5"/>

  <!-- the car: low coupe with a big swan-neck rear wing, facing left -->
  <path d="M272 312 C272 304 276 298 283 296 L293 294 C299 286 307 281 315 280 L331 280 C343 282 353 288 361 294 L375 296 C381 298 384 303 384 308 L384 312 Z"
        fill="#3B8EE2" fill-opacity=".3" stroke="#3B8EE2" stroke-width="2.8" stroke-linejoin="round"/>
  <!-- wing uprights + plank + endplate -->
  <path d="M366 294 L371 272 M379 295 L384 272" stroke="#3B8EE2" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M352 272 L392 268" stroke="#3B8EE2" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M392 263 V274" stroke="#3B8EE2" stroke-width="2.6" stroke-linecap="round"/>
  <!-- side window hint -->
  <path d="M312 284 L320 284 L330 293 L306 293 Z" fill="#0D1117" opacity=".5" stroke="#3B8EE2" stroke-width="1.4"/>
  <!-- wheels -->
  <circle cx="291" cy="312" r="10" fill="#0D1117" stroke="#FFFFFF" stroke-width="2.8"/>
  <circle cx="361" cy="312" r="10" fill="#0D1117" stroke="#FFFFFF" stroke-width="2.8"/>
  <circle cx="291" cy="312" r="3" fill="#3B8EE2"/>
  <circle cx="361" cy="312" r="3" fill="#3B8EE2"/>
</svg>
